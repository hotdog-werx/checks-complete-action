name: ci-checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: mise
        uses: jdx/mise-action@v3
      - name: check-dprint
        run: mise run check-dprint
