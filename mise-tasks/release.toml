# Release tasks. releez runs through uvx because the mise pipx venv ships a
# Python 3.11 that links against libssl.so.1.1 (gone from current Fedora),
# which crashes any releez command that imports pygithub. The workflow calls
# the pipx install directly since ubuntu runners don't have that problem.
[regen-changelog]
description = "regenerate the changelog with releez"
run = 'uvx --from "releez==1.1.1" releez changelog regenerate'

[start-releez]
description = "release start with releez"
run = """
git pull --tags -f &&
uvx --from "releez==1.1.1" releez release start
"""
