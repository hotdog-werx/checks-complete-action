[settings]
experimental = true

[task_config]
includes = [
  "mise-tasks",
  "mise-tasks/*.toml",
]

[env]
GITHUB_REPO_OWNER = "hotdog-werx"
GITHUB_REPO_NAME = "{{ config_root | basename }}"
GITHUB_REPO = "{{ env.GITHUB_REPO_OWNER }}/{{ env.GITHUB_REPO_NAME }}"
GIT_CLIFF_CONFIG = "./cliff.toml"

[tools]
dprint = "0.50.1"
starship = "1.21.1"
git-cliff = "2.11.0"
actionlint = "1.7.10"
shellcheck = "0.11.0"

"pipx:releez" = "1.1.1"
